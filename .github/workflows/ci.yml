name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-pack:
    name: Build, test and pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Show .NET information
        run: dotnet --info

      - name: Restore
        run: dotnet restore DProjects.XShell.sln

      - name: Build
        run: >
          dotnet build DProjects.XShell.sln
          --configuration Release
          --no-restore

      - name: Test
        run: >
          dotnet test --solution DProjects.XShell.sln
          --configuration Release
          --no-build
          --no-restore
          --

      - name: Pack
        run: >
          dotnet pack DProjects.XShell.sln
          --configuration Release
          --no-build
          --output artifacts/packages
